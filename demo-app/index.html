    <meta name="description" content="MetaShelf is a resource discovery platform that blends Library and Information Science (LIS) principles with a modern e-commerce browsing experience. The backend is built on FastAPI with async SQLAlchemy following Clean Architecture (Models/Schemas/Repositories/Services/API); the frontend is a React 19 + Vite + Tailwind card-based catalog. The data model uses FRBR-lite, separating Resource (bibliographic record) from Item (physical holding), with professional metadata like ISBN, call number, and subject headings. Currently an MVP." />
